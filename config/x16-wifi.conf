# Commander X16 appliance — Wi-Fi settings.
#
# EDIT THIS FILE FROM ANY PC: power the Pi off, put the SD card in your computer,
# and open this file on the small drive that appears. Save, eject, and boot the
# Pi — it applies these settings itself on every startup.
#
# Sourced by /bin/dash — keep it POSIX: KEY=value, no spaces around '=', and
# quote anything containing spaces or #.

# Your network's name, exactly as it appears (capitals matter).
# Leave empty to stay on Ethernet and not use Wi-Fi at all.
X16_WIFI_SSID=

# The Wi-Fi password. Leave empty for an open network.
# NOTE: this file is plain text on a partition any PC can read.
X16_WIFI_PSK=

# Two-letter country code — REQUIRED. Wi-Fi is regulated per country, and the Pi
# will refuse to transmit (or will only use 2.4 GHz) until it knows where it is.
# GB=United Kingdom, US=United States, DE=Germany, FR=France, AU=Australia, ...
X16_WIFI_COUNTRY=GB

# Set to 1 only if your network does not broadcast its name.
X16_WIFI_HIDDEN=0
