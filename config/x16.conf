# Commander X16 appliance — display settings.
# Edit here, or run:   x16-display      (interactive menu, over SSH)
# Changes take effect when the X16 restarts (the tool does that for you); the
# appliance loop re-reads this file every relaunch.
#
# Lives on the FAT boot partition (/boot/firmware/x16.conf) so it is editable
# from ANY PC by popping the SD card in. Sourced by /bin/dash — keep it POSIX
# (KEY=value, no spaces around '='). Any missing key falls back to a safe default.

# Aspect on your screen:
#   widescreen = fill a 16:9 TV (slight horizontal stretch)
#   authentic  = true 4:3 (black bars on the left/right)
X16_DISPLAY=widescreen

# Render scale, 1-4 (3 recommended at 1080p).
X16_SCALE=3

# Output resolution the Pi sends to the display:
#   1080p = force 1920x1080   (works on virtually every TV)
#   720p  = force 1280x720
X16_OUTPUT=1080p

# Force the TV-friendly mode above via a synthetic EDID (runtime debugfs override
# in custom.sh's apply_edid).
#   1 = force it (recommended; most TVs reject the X16's native 640x480 VGA/DMT)
#   0 = use the display's REAL EDID — for a true VGA monitor / VGA-HAT setup that
#       natively accepts 640x480. Requires a reboot to take effect.
#       (This is the path for the planned Pi 3 + VGA-HAT test.)
X16_FORCE_EDID=1

# How many SNES controller ports accept a USB gamepad, 0-4.
# r49 does NOT bind a pad unless the port is enabled with -joyN, so 0 means
# plugged-in gamepads are ignored entirely. Enabling a port costs nothing when no
# pad is present, so leave this at 1 unless you want multiplayer.
X16_JOYSTICKS=1

# Seconds to hold the boot splash before the X16 paints over it (0 = no splash).
X16_SPLASH_SECONDS=3

# Where the X16's files (-fsroot) live.
# Empty = the x16/ folder on THIS FAT partition, which any PC can see when the SD
# card is inserted.
# Set a path to use somewhere else, e.g. /mnt/x16 on the roomy ext4 root — needed
# for the full community library (~250 MB), which will not fit on FAT. The card
# stays usable from a PC: see X16_DROP_DIR below.
X16_FSROOT=

# Name of the PC-visible drop folder that appears INSIDE the fsroot.
# When X16_FSROOT points at the ext4 root, this FAT x16/ folder is bind-mounted
# there under this name, so the X16 sees the big library at its root and your own
# files one level down — and SAVE from the X16 writes back onto the card.
#   @CD:FAT-FILES  @$  LOAD"NAME.PRG",8    (or LOAD"FAT-FILES/NAME.PRG",8 directly)
# Empty = no drop folder (the card's x16/ folder is then not visible to the X16).
# Ignored when X16_FSROOT is empty, since the fsroot is already that folder.
X16_DROP_DIR=FAT-FILES
