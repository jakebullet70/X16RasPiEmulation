# Commander X16 appliance — silent tty1 launch.
# Install as: /etc/systemd/system/getty@tty1.service.d/dietpi-autologin.conf
# (overwrites DietPi's autologin drop-in of the same name), then daemon-reload.
#
# Instead of agetty autologin -> /bin/login -> shell -> dietpi-login -> custom.sh
# (which prints an "<user> (automatic login)" line + PAM/banners), this runs
# custom.sh DIRECTLY as the getty program:
#   --skip-login  : do not invoke /bin/login at all (no PAM, no "automatic login")
#   -l <program>  : the program to exec on the tty instead of login (custom.sh)
#   -J/--noclear  : don't clear the screen (keeps the boot splash on /dev/fb0)
#   --noissue --nohostname --nonewline : no /etc/issue, hostname, or leading newline
# custom.sh uses absolute paths and sets its own env, so it needs no login session;
# getty runs it as root on tty1 (the active VT), which is all SDL kmsdrm needs to
# become DRM master.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --skip-login -J --noissue --nohostname --nonewline -l /var/lib/dietpi/dietpi-autostart/custom.sh %I $TERM
