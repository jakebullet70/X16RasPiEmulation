# Commander X16 appliance — keep kernel messages off the X16's screen.
# Deploys to /etc/sysctl.d/98-x16-console.conf
#
#   console_loglevel = 1  -> only KERN_EMERG (level 0) is written to the console.
#   The other three fields are left at DietPi's values (default 4, minimum 1,
#   boot-time default 7); 1 is the floor, minimum_console_loglevel forbids 0.
#
# WHY THIS FILE EXISTS, and why it is numbered 98:
#
# DietPi ships /etc/sysctl.d/97-dietpi.conf containing "kernel.printk = 4 4 1 7".
# systemd-sysctl applies sysctl.d in LEXICAL order, so anything DietPi sets there
# beats what the kernel command line asked for — measured on the dev Pi, cmdline
# carried "quiet loglevel=1" and /proc/sys/kernel/printk still read 4. 98 sorts
# after 97, so this is the last word. Renumbering it below 97 silently disables it.
#
# WHAT IT FIXES, observed on hardware 2026-07-30:
# With console_loglevel at 4, any KERN_ERR (level 3) is printed to the foreground
# VT — and printing to a VT makes fbcon repaint the console over whatever the DRM
# client (x16emu) is showing. So a single late kernel error wipes the X16 off the
# screen mid-session. The one that exposed it:
#
#   ieee80211 phy0: brcmf_cfg80211_reg_notifier: Firmware rejected country setting
#
# fired at 9.06 s — 2.5 s AFTER the emulator was already running — every time
# Wi-Fi associated with an access point whose beacon advertises a different
# regulatory domain than the one configured. That is an ordinary owner's network,
# not a fault, and no country setting of ours prevents it: the AP wins, and the
# Broadcom firmware refuses the change the AP asks for.
#
# WHY NOT console=tty3 INSTEAD: it does not work for this. The kernel's VT console
# writes printk to fg_console — the FOREGROUND VT — whatever ttyN "console=" names.
# Verified by reading /dev/vcs1 and /dev/vcs3 directly: with console=tty3 active
# and "printk: legacy console [tty3] enabled" in dmesg, an injected KERN_ERR still
# appeared in VT1's text buffer and VT3 was empty. console=tty3 IS still set,
# because it does redirect /dev/console — userspace writers land on VT3 — but it
# is not what keeps kernel messages away. Do not remove this file on the strength
# of that cmdline token.
#
# Nothing is lost diagnostically: the ring buffer and the journal are untouched,
# so dmesg still shows everything. Only the write-to-screen is suppressed, and
# KERN_EMERG (a panic) still gets through, which is the one case where putting
# text over the emulator is the right behaviour.
kernel.printk = 1 4 1 7
